<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; script-src 'self'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="chrome">
  <!-- row 1: tab strip + window controls -->
  <div id="tabrow">
    <div id="tabstrip"></div>
    <button id="bNew" class="tbtn" data-i18n-title="tb.newtab" title="New tab (Ctrl+T)">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div id="dragspace"></div>
    <div id="winctl">
      <button id="wMin" class="wbtn" data-i18n-title="tb.min" title="Minimize"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1"/></svg></button>
      <button id="wMax" class="wbtn" data-i18n-title="tb.max" title="Maximize"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
      <button id="wClose" class="wbtn close" data-i18n-title="tb.close" title="Close"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2.2 2.2l7.6 7.6M9.8 2.2l-7.6 7.6" stroke="currentColor" stroke-width="1"/></svg></button>
    </div>
  </div>

  <!-- row 2: nav + omnibox + actions -->
  <div id="toolbar">
    <button id="bBack" class="ibtn" data-i18n-title="tb.back" title="Back (Alt+Left)">
      <svg viewBox="0 0 24 24" width="19" height="19"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z" fill="currentColor"/></svg>
    </button>
    <button id="bFwd" class="ibtn" data-i18n-title="tb.fwd" title="Forward (Alt+Right)">
      <svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z" fill="currentColor"/></svg>
    </button>
    <button id="bReload" class="ibtn" data-i18n-title="tb.reload" title="Reload (Ctrl+R)">
      <svg viewBox="0 0 24 24" width="17" height="17"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="omnibox">
      <span id="omni-sec">
        <svg viewBox="0 0 24 24" width="13" height="13"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      </span>
      <input id="omni" data-i18n-ph="omni.placeholder" placeholder="Search or enter address" spellcheck="false" autocomplete="off">
      <button id="omni-go" class="obtn" data-i18n-title="omni.go" title="Go">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <button id="bInc" class="ibtn" data-i18n-title="tb.incognito" title="New anonymous tab (Ctrl+Shift+N)">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10c2.5-2.5 5.5-4 8-4s5.5 1.5 8 4l-1.5 1.5c-1.8-1.6-4-2.5-6.5-2.5s-4.7.9-6.5 2.5L4 10z"/><path d="M8.5 12.5a3.5 3.5 0 0 0 7 0"/><path d="M4 16c1.8 1.8 4.5 3 8 3s6.2-1.2 8-3"/></svg>
    </button>
    <button id="bCap" class="ibtn" data-i18n-title="tb.capture" title="Packet capture (CDP Network)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"/></svg>
    </button>
    <button id="bDevtools" class="ibtn" data-i18n-title="tb.devtools" title="Page DevTools (Ctrl+Shift+I)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 5l-2 14"/></svg>
    </button>
    <button id="bPanel" class="ibtn" data-i18n-title="tb.panel" title="Dev panel (F12)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
    <button id="bMenu" class="ibtn" data-i18n-title="tb.menu" title="Menu">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    </button>
  </div>
</div>
<script src="chrome.js"></script>
</body>
</html>
